<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아크릴 테크블로그 — 일일 글감 추천</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Noto+Serif+KR:wght@400;500;600;700;900&display=swap">
<style>
/* =============================================================================
   리포트 테마 — 에디토리얼/신문(인쇄물) 미감
   이 파일 하나만 고치면 HTML 리포트 디자인이 통째로 바뀝니다.
   색/폰트/간격은 아래 :root 변수에서 조정하세요.
   ============================================================================= */
:root {
  --paper:  #f3efe5;   /* 종이(크림) 바탕 */
  --ink:    #1b1a17;   /* 잉크(검정) */
  --muted:  #56524a;   /* 보조 글자 */
  --rule:   #1b1a17;   /* 굵은 괘선 */
  --hair:   #c9c1ae;   /* 가는 괘선 */
  --accent: #7c2128;   /* 옥스블러드(신문 강조색) */
  --maxw:   840px;
  --serif:   "Noto Serif KR", "Nanum Myeongjo", Georgia, "Times New Roman", serif;
  --display: "Playfair Display", "Noto Serif KR", Georgia, serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.72;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 44px 22px 90px; }

/* ---- 제호(masthead) ---- */
.masthead { text-align: center; border-bottom: 3px double var(--rule); padding-bottom: 18px; }
.eyebrow {
  display: block;
  font-size: 12px; letter-spacing: .34em; text-transform: uppercase; color: var(--muted);
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  padding: 7px 0; margin-bottom: 18px;
}
.masthead h1 {
  font-family: var(--display); font-weight: 900;
  font-size: clamp(34px, 7vw, 60px); line-height: 1.04; letter-spacing: -.01em;
  margin: 6px 0 14px;
}
.masthead .meta {
  font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.masthead .meta a { color: var(--accent); text-decoration: none; }

/* ---- 머리글(오늘의 흐름) — 신문 스탠드퍼스트 + 드롭캡 ---- */
.flow { border-bottom: 1px solid var(--rule); padding: 22px 0 24px; margin: 0 0 36px; }
.flow h2 {
  font-weight: 700; font-size: 12px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--accent); text-align: center; margin: 0 0 14px;
}
.flow p { margin: 0; font-size: 18.5px; text-align: justify; }
.flow p::first-letter {
  float: left; font-family: var(--display); font-weight: 900;
  font-size: 3.4em; line-height: .82; padding: 6px 12px 0 0; color: var(--ink);
}

/* ---- 섹션 제목 ---- */
.section-title {
  text-align: center; font-weight: 700; font-size: 13px;
  letter-spacing: .32em; text-transform: uppercase; color: var(--ink);
  margin: 14px 0 4px; padding-bottom: 12px; border-bottom: 1px solid var(--rule);
}

/* ---- 기사(주제) ---- */
.card { border-bottom: 1px solid var(--hair); padding: 28px 0 24px; }
.card:last-of-type { border-bottom: none; }
.card-head { display: flex; gap: 16px; align-items: baseline; }
.rank {
  font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1;
  color: var(--accent); min-width: 1.1em;
}
.card h3 {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(22px, 3.4vw, 30px); line-height: 1.14; letter-spacing: -.01em; margin: 0;
}

/* 바이라인 형태의 메타(배지) */
.badges {
  margin: 12px 0 16px;
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
}
.badge::after { content: "  ·  "; color: var(--hair); }
.badge:last-child::after { content: ""; }
.badge.score { color: var(--accent); font-weight: 700; }

.field { margin: 13px 0; }
.field .label {
  display: block; font-weight: 700; font-size: 11.5px;
  letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px;
}
.field p { margin: 0; text-align: justify; }

.points { margin: 6px 0 0; padding: 0; list-style: none; }
.points li { position: relative; padding-left: 16px; margin: 5px 0; }
.points li::before { content: "—"; position: absolute; left: 0; color: var(--accent); }

.sources { margin-top: 16px; padding-top: 13px; border-top: 1px dotted var(--hair); font-size: 14px; }
.sources .label {
  display: block; font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 7px;
}
.sources a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--hair); }
.sources a:hover { border-bottom-color: var(--accent); }

/* ---- 푸터 ---- */
.footer {
  text-align: center; margin-top: 50px; padding-top: 18px;
  border-top: 3px double var(--rule);
  font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted);
}
.footer code { font-family: var(--serif); font-style: italic; letter-spacing: 0; text-transform: none; }

.empty {
  border: 1px solid var(--hair); padding: 40px; text-align: center;
  color: var(--muted); font-style: italic;
}

</style>
</head>
<body>
<div class="wrap">
<header class="masthead">
<span class="eyebrow">Acryl Tech Blog</span>
<h1>📚 일일 글감 추천</h1>
<p class="meta">외신·AI 커뮤니티·arXiv·빅테크 블로그를 매일 분석해 블로그 글감을 추천합니다.</p>
</header>
<h2 class="section-title">리포트</h2>
<div class="empty">아직 생성된 리포트가 없습니다. 곧 첫 리포트가 올라옵니다.</div>
<footer class="footer">Powered by Claude · 매일 자동 갱신</footer>
</div>
</body>
</html>
