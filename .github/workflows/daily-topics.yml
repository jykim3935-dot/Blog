name: 일일 글감 추천

on:
  # 코드/설정이 바뀌면 실행(= 워크플로 등록을 보장하고, 설정 변경 시 즉시 갱신).
  # reports/** 는 제외 — 자기 자신이 만든 리포트 커밋으로 재실행되는 것을 막음.
  push:
    branches:
      - claude/techblog-content-agent-k5x5fq
    paths:
      - "src/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/daily-topics.yml"
  # 매일 KST 오전 8시 (UTC 23:00)
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      extra_urls:
        description: "추가로 분석할 소스 URL (쉼표로 구분)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-topics
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 글감 추천 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTRA_SOURCE_URLS: ${{ github.event.inputs.extra_urls }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY 시크릿이 없어 글감 생성을 건너뜁니다."
            echo "Settings → Secrets and variables → Actions 에 키를 등록한 뒤 다시 실행하세요."
            exit 0
          fi
          python -m src.main

      - name: 리포트 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 커밋 건너뜀"
          else
            git commit -m "chore: 일일 글감 추천 리포트 $(date -u +%Y-%m-%d)"
            git push
          fi
