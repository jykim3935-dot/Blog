name: GitHub Pages 배포

on:
  # reports 폴더가 바뀌면(=새 리포트 커밋 시) 자동 배포
  push:
    branches:
      - claude/techblog-content-agent-k5x5fq
    paths:
      - "reports/**"
      - "config/report_theme.css"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1개만, 진행 중이면 최신 것으로 교체
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정
        uses: actions/configure-pages@v5

      - name: 리포트 폴더 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
